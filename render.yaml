# Backend Core: build from the repository root so npm workspaces resolve.
services:
  - type: web
    name: erp-backend
    runtime: node
    branch: main
    plan: free
    buildCommand: npm ci && npm run build:packages && npm run backend:build
    startCommand: npm run backend:start
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 15
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: ENABLE_MULTI_COMPANY
        value: 'false'
      - key: ENABLE_BRANCHES
        value: 'false'
      - key: ENABLE_WAREHOUSES
        value: 'false'
